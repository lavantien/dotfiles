[default.extend-words]
noice = "noice"
nd = "nd"
som = "som"

[default.extend-identifiers]
noice = "noice"
ccontains = "ccontains"

# Historical changelog entries quote the typos they fixed
[type.changelog]
extend-glob = ["CHANGELOG.md"]

[type.changelog.extend-words]
persspective = "persspective"
offical = "offical"
oudated = "oudated"
ADDRESSS = "ADDRESSS"

# Published books corpus mirrors the private corpus, not repo-authored prose
[files]
extend-exclude = [".claude/books/**"]
